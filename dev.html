<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>pts dev tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%2316233B' stroke='%23F2A516' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .dev { max-width: 1180px; margin: 0 auto; }
    .dev-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; margin-bottom: 16px; }
    .dev-head h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.2rem); }
    .dev-head p { margin: 0; color: var(--muted); }
    .dev-head .spacer { flex: 1; }
    .dev-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .dev-tabs button { border: 1px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 14px; font: inherit; font-weight: 700; cursor: pointer; }
    .dev-tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .dev-card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; }
    .dev-card h2 { margin: 0 0 10px; font-size: 1.1rem; }
    .dev-card h3 { margin: 14px 0 6px; font-size: 0.95rem; color: var(--muted); }
    .dev-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
    .row label { font-weight: 700; }
    .dev input[type=text], .dev input[type=number], .dev select, .dev textarea {
      font: inherit; padding: 7px 10px; border: 1px solid var(--rule); border-radius: var(--radius-sm); background: var(--paper); color: var(--ink); min-width: 0;
    }
    .dev textarea { width: 100%; min-height: 80px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.85rem; }
    .dev input.grow, .dev textarea.grow { flex: 1 1 220px; }
    .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: 0.92rem; }
    .kv dt { color: var(--muted); font-weight: 700; }
    .kv dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    pre.out { background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 0.82rem; overflow: auto; max-height: 360px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0 0; }
    table.dt { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    table.dt th, table.dt td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
    table.dt th { color: var(--muted); }
    table.dt td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .ok { color: var(--ok); font-weight: 700; }
    .bad { color: var(--bad); font-weight: 700; }
    .muted { color: var(--muted); }
    .qbox { background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius-sm); padding: 12px 14px; margin-top: 8px; }
    .qbox .meta { color: var(--muted); font-size: 0.88rem; margin-bottom: 6px; }
    .qbox ol { margin: 6px 0 0; padding-left: 22px; }
    .spoken { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.85rem; }
    .spoken .chg { background: color-mix(in srgb, var(--lamp) 30%, transparent); border-radius: 3px; }
    .log { max-height: 220px; }
    .voicebar { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 8px 12px; margin: 0 0 16px; }
    .voicebar select { max-width: min(100%, 420px); }
    .rv-cols { display: grid; grid-template-columns: minmax(280px, 400px) 1fr; gap: 16px; align-items: start; }
    @media (max-width: 860px) { .rv-cols { grid-template-columns: 1fr; } }
    .rv-list tr { cursor: pointer; }
    .rv-list tr:hover td, .rv-list tr.rv-cur td { background: color-mix(in srgb, var(--lamp) 14%, transparent); }
    .rv-snip { font-size: 0.82rem; }
    .rv-reason { font-size: 0.8rem; max-width: 9em; }
    .rv-shot { display: block; max-width: 100%; max-height: 420px; object-fit: contain; object-position: left top; background: #fff; border: 1px solid var(--rule); border-radius: var(--radius-sm); margin: 8px 0; cursor: zoom-in; }
    .rv-shot.rv-zoom { max-height: none; cursor: zoom-out; }
    .rv-form { display: grid; gap: 8px; margin-top: 10px; }
    .rv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .rv-grid4 { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
    .rv-f { display: grid; gap: 3px; font-size: 0.85rem; }
    .rv-f > span { color: var(--muted); font-weight: 700; }
    .rv-f textarea { font-family: inherit; font-size: 0.95rem; }
    .rv-answer, .rv-accept { grid-column: span 2; }
    .rv-probs { margin: 4px 0; padding-left: 20px; font-size: 0.88rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main id="main" class="dev">
    <div class="dev-head">
      <h1>pts dev tools</h1>
      <p>Troubleshooting page. Not linked from the site.</p>
      <span class="spacer"></span>
      <a class="btn small" href="./">Open the site</a>
      <a class="btn small" href="./?net=local#rooms" title="Rooms that work between tabs of this browser, without the network">Local rooms</a>
      <button class="btn small" id="theme" type="button">Theme</button>
    </div>
    <div class="dev-tabs" role="tablist" id="tabs"></div>
    <div class="row voicebar" id="voicebar"></div>
    <div id="panes"></div>
  </main>
  <script type="module" src="js/dev.js"></script>
</body>
</html>
