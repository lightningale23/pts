# Adds the questions approved on dev.html's Review tab to the banks.
# The Review tab saves review/decisions.json; this runs importer/apply_review.py on every push
# that changes it, then commits the bank, review/applied.json and the changelog.
name: Apply review

on:
  push:
    branches: [main]
    paths:
      - 'review/decisions.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-review
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Always start from the newest main. A queued run would otherwise check out the commit that
      # triggered it, which is stale once an earlier run has pushed, and the push would conflict.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: pip install scikit-learn

      - name: Add approved questions
        run: python importer/apply_review.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test
        if: hashFiles('review/.commit-msg') != ''
        run: npm test

      - name: Commit
        run: |
          if [ ! -f review/.commit-msg ]; then echo "Nothing to add."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions.csv data/osb-questions.csv data/changelog.json review/applied.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -F review/.commit-msg
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 10
          done
          exit 1
